{% extends 'blog/base.html' %}

{% block title %} Django Blog | Posts by Tag {% endblock %}

{% block content %}


<h1>Posts with "{{ tag.name }}"</h1>

{% if posts %}
    <ul>
    {% for post in posts %}
        <li><a href="{% url 'post-detail' post.id %}">{{ post.title }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No posts found with this tag.</p>
{% endif %}

{% endblock %}
