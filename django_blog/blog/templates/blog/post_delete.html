{% extends 'blog/base.html' %}

# Deleting Posts
{% block title %} Django Blog | Delete Post {% endblock %}

{% block content %}
    <h4>Delete Post</h4>
    <p>Are you sure you want to delete the post "{{ post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'posts' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
