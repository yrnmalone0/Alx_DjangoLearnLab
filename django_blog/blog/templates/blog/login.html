{% extends 'blog/base.html' %}

{% load crispy_forms_tags %}

{% block title %} Login {% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <p>Don't have an account? Signup <a href="/sign-up">here</a></p>
    <button type="submit" class="btn btn-success">Login</button>
</form>

{% endblock %}
