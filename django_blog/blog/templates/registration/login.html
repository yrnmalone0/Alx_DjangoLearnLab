{% extends 'blog/base.html' %}

{% load crispy_forms_tags %}

{% block title %} Django Blog | Login {% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}
    {{ loginform|crispy }}

    <p>Don't have an account? Register <a href="{% url 'register' %}">here</a></p>
    <button type="submit" class="btn btn-success">Login</button>
</form>

{% endblock %}
